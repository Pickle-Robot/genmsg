[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "genmsg"
version = "0.3.10"
description = "ROS message and service generation library"
license = "BSD-3-Clause"
authors = [
    {name = "Ken Conley", email = "kwc@willowgarage.com"},
    {name = "Josh Faust"},
    {name = "Troy Straszheim"},
]
keywords = ["ROS", "robotics", "messages"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.8"

[tool.hatch.build.targets.wheel]
packages = ["src/genmsg"]
